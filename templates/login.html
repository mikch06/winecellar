{% extends "./wines/base.html" %}
{% block content %}
{% load static %}
<div class="flex items-center justify-center bg-gray-100 px-4 py-12">
    <div class="w-full max-w-md rounded-2xl border border-gray-100 bg-white p-8 shadow-sm">
    <div class="mb-8 text-center">
      <div class="text-4xl mb-3">
        🍷
      </div>
      <h1 class="text-2xl font-semibold text-gray-900">
        MyBottles
      </h1>
      <p class="mt-2 text-sm text-gray-500">
        Login zu Deinem Weinkeller
      </p>
    </div>
    <form method="post" action="{% url 'login' %}" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="mb-1 block text-sm text-gray-600">
          Username
        </label>
        <input
          type="text"
          name="username"
          placeholder="Username"
          class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-gray-200"
        >
      </div>
      <div>
        <label class="mb-1 block text-sm text-gray-600">
          Password
        </label>
        <input
          type="password"
          name="password"
          placeholder="Password"
          class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-gray-200"
        >
      </div>
      {% if form.errors %}
      <div class="rounded-xl bg-red-50 px-4 py-3 text-sm text-red-600">
        Username or password incorrect.
      </div>
      {% endif %}
      <button
        type="submit"
        class="inline-flex w-full items-center justify-center rounded-xl bg-gray-900 px-4 py-3 text-sm font-medium text-white hover:bg-gray-800 transition"
      >
        Login
      </button>
      <input type="hidden" name="next" value="{{ next }}" />
    </form>
    <div class="mt-6 text-center">
      <a href="{% url 'password_reset' %}"
         class="text-sm text-gray-500 hover:text-gray-900">
        Lost password?
      </a>
    </div>
  </div>
</div>
{% endblock %}
