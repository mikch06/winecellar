{% extends "../wines/base.html" %}
{% block content %}


{% load static %}
<div class="flex items-center justify-center bg-gray-100 px-4 py-12">
    <div class="w-full max-w-md rounded-2xl border border-gray-100 bg-white p-8 shadow-sm">
    <div class="mb-8 text-center">
      <div class="login">
        <form action="" method="post">
          {% csrf_token %}
          {% if form.email.errors %}
          {{ form.email.errors }}
          {% endif %}
        <input type="text" id="email" placeholder="E-Mail" name="email"
          class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-gray-200"
        >
        <br>
        <input type="submit" value="Reset password">
      </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
