{% extends "base.html" %}

{% block title %}Weine{% endblock %}

{% block content %}

<a class="btn"
   href="{% url 'wine_create' %}"
   up-layer="new"
   up-target="body">
   + Neuer Wein
</a>

<hr>

<div>
    {% for wine in wines %}
        <div class="wine-card">
            <strong>{{ wine.name }}</strong><br>
            {{ wine.year }} · {{ wine.region }}

            <div style="margin-top: 5px;">
                <a class="btn"
                   href="{% url 'wine_detail' wine.id %}"
                   up-target="#content">
                   Öffnen
                </a>

                <a class="btn"
                   href="{% url 'wine_edit' wine.id %}"
                   up-layer="new">
                   Bearbeiten
                </a>
            </div>
        </div>
    {% endfor %}
</div>

<div id="content"></div>

{% endblock %}
