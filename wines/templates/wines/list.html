{% extends "./base.html" %}
{% block content %}

<div class="space-y-5">

  <!-- TOOLBAR -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">

    <form
      id="filters"
      up-target="#wine-table"
      up-autosubmit
      class="flex flex-col md:flex-row gap-3 md:items-center">

      <input
        type="text"
        name="q"
        value="{{ q }}"
        placeholder="🔍 Suche Wein, Produzent..."
        class="w-full md:w-96 px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-gray-200 outline-none"
      >

      <select
        name="country"
        class="px-3 py-3 rounded-xl border border-gray-200">

        <option value="">🌍 Alle Länder</option>

        {% for c in countries %}
          <option value="{{ c }}" {% if country == c %}selected{% endif %}>
            {{ c }}
          </option>
        {% endfor %}

      </select>

      <a href="{% url 'wine_list' %}"
         class="text-sm text-gray-400 hover:text-gray-700 ml-auto">
        Reset
      </a>

    </form>

  </div>


  <!-- META BAR (Airtable feeling) -->
  <div class="flex items-center justify-between text-sm text-gray-500 px-1">

    <div>
      {{ wines|length }} Weine
    </div>

  </div>


  <!-- TABLE CARD -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

    <div id="wine-table">
      {% include "wines/_table.html" %}
    </div>

  </div>

</div>




{% endblock %}
