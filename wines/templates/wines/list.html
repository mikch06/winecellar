{% extends "./base.html" %}
{% block content %}

<div class="space-y-6">

  <!-- TOP BAR -->
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4">

    <form
      id="filters"
      up-target="#wine-table"
      up-autosubmit
      class="flex flex-col md:flex-row md:items-center gap-3">

      <input
        type="text"
        name="q"
        value="{{ q }}"
        placeholder="🔍 Search wines, producers..."
        class="w-full md:w-96 px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-gray-200 outline-none"
      >


      <a href="{% url 'wine_list' %}"
         class="text-sm text-gray-400 hover:text-gray-700 ml-auto">
        Reset
      </a>

    </form>

  </div>

  <!-- ACTIVE FILTERS -->
  {% if q %}
  <div class="flex flex-wrap gap-2 text-sm">

    {% if q %}
      <div class="bg-gray-100 px-3 py-1 rounded-full flex items-center gap-2">
        🔍 {{ q }}
      </div>
    {% endif %}

  </div>
  {% endif %}

  <!-- META -->
  <div class="flex justify-between text-sm text-gray-500 px-1">
    <div>{{ wines|length }} wines</div>
  </div>

  <!-- TABLE -->
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">

    <form up-autosubmit up-target="#wine-table" class="w-full rounded-md border border-gray-200 px-2 py-1 text-xs">

      <input name="winename" class="w-full rounded-md border border-gray-200 px-2 py-1 text-xs">
      <input name="producer">
      <input name="country">
      <input name="year">
      <input name="drinkfrom">
      <input name="drinkto">
      <input name="nmbrbottles">

        <input
          type="text"
          name="winename"
          value="{{ request.GET.winename }}"
          placeholder="Filter..."
          class="w-full rounded-md border border-gray-200 px-2 py-1 text-xs">

      <!-- PRODUCER -->
        <input
          type="text"
          name="producer"
          value="{{ request.GET.producer }}"
          placeholder="Filter..."
          class="w-full rounded-md border border-gray-200 px-2 py-1 text-xs">

      <!-- COUNTRY -->
        <select
          name="country"
          class="w-full rounded-md border border-gray-200 px-2 py-1 text-xs">

          <option value="">Alle</option>

          {% for c in countries %}
            <option value="{{ c }}" {% if request.GET.country == c %}selected{% endif %}>
              {{ c }}
            </option>
          {% endfor %}

        </select>

      <!-- YEAR -->
        <input
          type="number"
          name="year"
          value="{{ request.GET.year }}"
          placeholder="Jahr"
          class="w-full rounded-md border border-gray-200 px-2 py-1 text-xs">

      <!-- DRINK FROM -->
        <input
          type="number"
          name="drinkfrom"
          value="{{ request.GET.drinkfrom }}"
          placeholder="From"
          class="w-full rounded-md border border-gray-200 px-2 py-1 text-xs">

      <!-- DRINK TO -->
        <input
          type="number"
          name="drinkto"
          value="{{ request.GET.drinkto }}"
          placeholder="To"
          class="w-full rounded-md border border-gray-200 px-2 py-1 text-xs">

      <!-- BOTTLES -->
        <input
          type="number"
          name="nmbrbottles"
          value="{{ request.GET.nmbrbottles }}"
          placeholder="Flacon"
          class="w-full rounded-md border border-gray-200 px-2 py-1 text-xs">

    </form>


    <div id="wine-table">
      {% include "wines/_table.html" %}
    </div>

  </div>

</div>

{% endblock %}
